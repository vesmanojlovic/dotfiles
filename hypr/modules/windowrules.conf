##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hypr.land/Configuring/Window-Rules/ for more
# See https://wiki.hypr.land/Configuring/Workspace-Rules/ for workspace rules

# Example windowrule
# windowrule = float,class:^(kitty)$,title:^(kitty)$

# Ignore maximize requests from apps. You'll probably like this.
windowrule = suppress_event maximize, match:class .*

# exec-once = swaybg -i /path/to/wallpaper.jpg &
exec-once = qs
exec-once = blueman-applet
exec-once = syncthing
exec-once = nicotine
exec-once = hypridle
exec-once = ~/.config/hypr/scripts/notif-autodismiss.py

# Music Player Rules
# 1. Force it to float
windowrule = match:class ^(music_player)$, float on
windowrule = match:class ^(music_player)$, size 1200 1920
windowrule = match:class ^(music_player)$, center on
windowrule = match:class ^(music_player)$, opacity 0.9 0.9
windowrule = match:class ^(music_player)$, border_size 0
windowrule = match:class ^(music_player)$, workspace 10
windowrule = match:class ^(music_player)$, monitor DP-2
