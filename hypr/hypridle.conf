# See https://wiki.hyprland.org/Hypr-Ecosystem/hypridle
#
# Idle timers pause automatically while any client holds an idle-inhibit
# (e.g. mpv/Brave during video playback), regardless of window focus -
# this is native Hyprland behavior, no extra config needed here.

general {
    lock_cmd = pidof hyprlock || hyprlock       # avoid starting multiple hyprlock instances
    before_sleep_cmd = loginctl lock-session    # lock before suspend
    after_sleep_cmd = hyprctl dispatch dpms on  # turn screen back on after resume
}

listener {
    timeout = 1800                    # 30 min -> lock
    on-timeout = loginctl lock-session
}

listener {
    timeout = 1860                    # 31 min (~1 min after lock) -> screen off
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

listener {
    timeout = 3600                    # 60 min -> suspend
    on-timeout = systemctl suspend
}
